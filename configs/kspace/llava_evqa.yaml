alg_name: "XSpace"
name: liuhaotian/llava-v1.5-7b
model_name: "llava"
model_class: LlamaForCausalLM
tokenizer_class: LlamaTokenizer
tokenizer_name: liuhaotian/llava-v1.5-7b
cache_dir: models/cache
device: 0
cpu_copy: True

lora_type: "lora"
layers: [7]
num_steps: 70
batch_size: 1
max_length: 30
lr: 1e-2
weight_decay: 0
kl_factor: 0
rank: 128
lora_alpha: 128
lora_dropout: 0
norm_constraint: false

target_modules: ['up_proj', 'down_proj']
# ["q_proj", "v_proj", "up_proj", "down_proj"]
# ["q_proj", "v_proj"]

exclude_modules: []
model_parallel: false

#LoRANULL
calib_dataset: null_ds
calib_loader_size: 256
calib_cache: outputs/cache
nq_open: data/LoRANULL/nq_hf_dataset.pt
seed: 233
save_model: True
save_path: outputs/adapters/kspace
Null_mode: True
mode: build_adapters
act_aware: False
cov_aware: False
singular_aware: True
singular_aware_2: False
first_eigen: False
use_cache: True
delete_name: ["mm_projector", "vision_tower"]
null_target_modules: llava_model.model
# KSpace (historical internal identifier: XSpace)
wL: 24
wS: 8
sim: 0.05
update_modules: ["ALinear"]
noise: 0.01
num_samples: 512
svd_thres: 10
bn_lr: 5e-4
svd_lr: 5e-4
model_optimizer: Adam
schedule: [30, 60, 80]
gamma: 0.5
momentum: 0
perturb_seed: 233
pca_seed: 42

# image
coco_image: data
rephrase_image: data
mmke_image: data/MMKE/data_image
result_dir: outputs
train_annotation_path: data/editing-data/vqa/vqa_train.json
eval_annotation_path: data/editing-data/vqa/vqa_eval.json
caption_train_annotation_path: data/editing-data/caption/caption_train_edit.json
mmke_train_annotation_path: data/MMKE/data_json/entity_train.json


# Evaluation
all_metrics_name: 'layer7_updown_ep70_th10_sim0.05_wL24_wS8_rank128_5e-4_5e-4_up_down_11111111.jsonl'
json_dir: outputs/jsonl
continuous_sample: 1

real_world_eval: false
api_key: null
